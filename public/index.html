    <title>Bible@500 - Bible Quiz Dashboard</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // Decodes the path that 404.html stashed in the query string back
      // into a real pathname before React Router mounts.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
