<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Bible@500 - Bible Quiz Dashboard</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // Redirects unknown paths back to index.html, preserving the path in
      // the query string, so client-side routing (React Router) can pick it
      // back up after index.html re-decodes it.
      var pathSegmentsToKeep = 1; // keep "/Bible-500-Dashboard"

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
